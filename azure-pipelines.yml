# Azure DevOps continuous delivery pipeline for the library data.
# Tests and cleans the data, then deploys the processed artifact to an environment.

trigger:
- main

pr: none

variables:
  pythonVersion: '3.13'
  artifactName: 'processed-library-data'

stages:
- stage: Test
  displayName: Run tests
  jobs:
  - job: RunTests
    displayName: Install dependencies and run pytest
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: Install dependencies

    - script: python -m pytest -q
      displayName: Run unit tests

- stage: BuildData
  displayName: Build processed data
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: CleanData
    displayName: Run the data-cleaning application
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: Install dependencies

    - script: python src/main.py
      displayName: Clean and validate library data

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/data/processed'
        artifact: '$(artifactName)'
      displayName: Publish processed data artifact

- stage: Deploy
  displayName: Deploy processed data
  dependsOn: BuildData
  condition: succeeded()
  jobs:
  - deployment: DeployProcessedData
    displayName: Deploy processed library data
    environment: Library-Production
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: '$(artifactName)'
            displayName: Download processed data artifact

          - script: |
              echo "Processed library data deployed to the Library-Production environment."
              find "$(Pipeline.Workspace)/$(artifactName)" -maxdepth 1 -type f -print
            displayName: Confirm deployment
