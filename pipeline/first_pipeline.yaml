# Azure DevOps pipeline for the library data-cleaning application.

trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.13'

stages:
- stage: Test
  displayName: Run tests
  jobs:
  - job: RunTests
    displayName: Install dependencies and run pytest
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: Install dependencies

    - script: python -m pytest -q
      displayName: Run unit tests

- stage: CleanData
  displayName: Clean library data
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: RunCleaner
    displayName: Run the data-cleaning application
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: Install dependencies

    - script: python src/main.py
      displayName: Clean and validate library data

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/data/processed'
        artifact: 'processed-library-data'
      displayName: Publish processed data artifact
