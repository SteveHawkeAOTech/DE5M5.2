name: Library data CI and Docker Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  
jobs:
  test-clean-and-build:
    name: Test, clean data, and build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Clean and validate library data
        run: python src/main.py

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-library-data
          path: data/processed/

      - name: Build Docker image
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          docker build . \
            --file Dockerfile \
            --tag library-quality-analysis:${{ github.sha }} \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:latest"

      - name: Run Docker image tests and application
        run: docker run --rm library-quality-analysis:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
