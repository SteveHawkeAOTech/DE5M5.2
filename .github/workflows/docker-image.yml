name: Library data CI and Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  test-clean-and-build:
    name: Test, clean data, and build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Clean and validate library data
        run: python src/main.py

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-library-data
          path: data/processed/

      - name: Build Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag library-quality-analysis:${{ github.sha }}
